# Dependabot: weekly grouped npm + Actions updates.
#
# Pairs with `dependabot-auto-merge.yml`: patch/minor bumps merge
# automatically once protection checks pass; majors stay open for
# human review. Grouping keeps the PR noise to (at most) one npm
# PR and one Actions PR per week.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - dependencies
