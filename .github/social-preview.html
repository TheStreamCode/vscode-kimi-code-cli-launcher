<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1280, initial-scale=1">
    <title>Kimi Code CLI Launcher social preview</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 640px; margin: 0; overflow: hidden; }
      body {
        color: #f8fbff;
        background:
          radial-gradient(circle at 78% 18%, rgba(80, 181, 255, .24), transparent 28%),
          radial-gradient(circle at 18% 88%, rgba(19, 113, 224, .20), transparent 32%),
          linear-gradient(135deg, #080d19 0%, #0b1426 52%, #101d34 100%);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .frame {
        position: relative;
        display: grid;
        grid-template-columns: 320px 1fr;
        align-items: center;
        gap: 74px;
        width: 100%;
        height: 100%;
        padding: 72px 86px;
      }
      .frame::before {
        content: "";
        position: absolute;
        inset: 22px;
        border: 1px solid rgba(129, 196, 255, .14);
        border-radius: 34px;
        pointer-events: none;
      }
      .mark {
        width: 292px;
        height: 292px;
        filter: drop-shadow(0 30px 60px rgba(0, 0, 0, .42));
      }
      .eyebrow {
        margin: 0 0 18px;
        color: #75c7ff;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: .16em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 720px;
        margin: 0;
        font-size: 68px;
        font-weight: 760;
        letter-spacing: -.045em;
        line-height: .98;
      }
      .tagline {
        max-width: 690px;
        margin: 26px 0 34px;
        color: #b8c9df;
        font-size: 29px;
        line-height: 1.32;
      }
      .platforms {
        display: flex;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .platforms li {
        padding: 9px 15px;
        color: #dcecff;
        background: rgba(255, 255, 255, .055);
        border: 1px solid rgba(151, 207, 255, .18);
        border-radius: 999px;
        font-size: 18px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <img class="mark" src="../media/icon.png" alt="">
      <section>
        <p class="eyebrow">VS Code extension</p>
        <h1>Kimi Code CLI Launcher</h1>
        <p class="tagline">Open Kimi in a fresh, workspace-aware side terminal — in one click.</p>
        <ul class="platforms" aria-label="Supported platforms">
          <li>Windows</li>
          <li>macOS</li>
          <li>Linux</li>
        </ul>
      </section>
    </main>
  </body>
</html>
