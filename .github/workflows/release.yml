name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example v0.1.5)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  github-release:
    name: Package GitHub release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Verify tag and package versions
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run validation suite
        run: xvfb-run -a npm run check

      - name: Audit locked dependencies
        run: npm run check:security

      - name: Build VSIX
        shell: bash
        run: |
          npm run package
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          VSIX="vscode-kimi-code-cli-launcher-$PACKAGE_VERSION.vsix"
          sha256sum "$VSIX" > "$VSIX.sha256"

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          VSIX="vscode-kimi-code-cli-launcher-$PACKAGE_VERSION.vsix"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$VSIX" "$VSIX.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX" "$VSIX.sha256" --generate-notes --title "Kimi Code CLI Launcher $GITHUB_REF_NAME" --verify-tag
          fi

  publish:
    name: Publish released VSIX
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download the released VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VSIX="vscode-kimi-code-cli-launcher-${RELEASE_TAG#v}.vsix"
          mkdir -p .release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$VSIX" \
            --pattern "$VSIX.sha256" \
            --dir .release
          (cd .release && sha256sum -c "$VSIX.sha256")

      - name: Publish to Visual Studio Marketplace
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          npx --yes @vscode/vsce@4.1.0 publish \
            --packagePath ".release/vscode-kimi-code-cli-launcher-${RELEASE_TAG#v}.vsix" \
            --oidc --skip-duplicate

      - name: Publish to Open VSX
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          npx --yes ovsx@1.3.0 publish \
            --packagePath ".release/vscode-kimi-code-cli-launcher-${RELEASE_TAG#v}.vsix" \
            --trusted-publishing --skip-duplicate
