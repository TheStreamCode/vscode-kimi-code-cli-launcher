name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  github-release:
    name: Package GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VSCODE_TEST_USER_DATA_DIR: ${{ runner.temp }}/kimi-vscode-test
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Verify tag and package versions
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run validation suite
        run: xvfb-run -a npm run check

      - name: Audit locked dependencies
        run: npm run check:security

      - name: Build VSIX
        run: npm run package

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          VSIX="vscode-kimi-code-cli-launcher-$PACKAGE_VERSION.vsix"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX" --generate-notes --title "$GITHUB_REF_NAME" --verify-tag
          fi
